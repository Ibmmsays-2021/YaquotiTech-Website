name: CI/CD

# Flow: feature branch → PR into develop → PR develop into main (release) → deploy.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-source:
    name: Release source
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Only develop or hotfix/* may merge into main
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = "main" ] && [ "$HEAD" != "develop" ] && [[ "$HEAD" != hotfix/* ]]; then
            echo "::error::PRs into main must come from develop (or a hotfix/* branch). Open this PR against develop instead."
            exit 1
          fi
          echo "OK: $HEAD → $BASE"

  build:
    name: Build & checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build (prerender + sitemap)
        run: npm run build

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/yaquoti-tech/browser
          retention-days: 14

  deploy:
    name: Deploy
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Deploy to Azure Static Web Apps
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          action: upload
          app_location: site
          skip_app_build: true
          skip_api_build: true

      - name: No deploy target configured
        if: env.SWA_TOKEN == ''
        run: echo "::notice::Built site is attached to this run as the 'site' artifact. Add the AZURE_STATIC_WEB_APPS_API_TOKEN secret to deploy automatically."
